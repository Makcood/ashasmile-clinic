jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ashasmile_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ashasmile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ashasmile_test
      DB_USERNAME: ashasmile_user
      DB_PASSWORD: password

    steps:
